name: Build NOVA OS APK

# Produces an installable Android APK and publishes it as a GitHub Release
# asset, which is exactly what the "تحميل APK" button inside NOVA looks for
# (docs/06-install.md). No secrets required.

on:
  push:
    branches:
      - main
      - 'arena/**'      # work-in-progress builds are published as pre-releases
    paths:
      - 'prototype/**'
      - 'android/**'
      - 'tools/**'
      - 'VERSION'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the APK as a GitHub Release asset'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nova-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build + publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install tooling
        run: npm ci

      # the motion contract is enforced before anything is shipped
      - name: Quality gates
        run: npm run check

      - name: Stage the web experience into the APK assets
        run: bash tools/stage-assets.sh

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: a stable signing key so new builds install *over* the old ones
      # in place. Add these repository secrets to enable it (docs/06-install.md §6):
      #   NOVA_KEYSTORE_BASE64, NOVA_STORE_PASSWORD, NOVA_KEY_ALIAS, NOVA_KEY_PASSWORD
      - name: Restore your signing key (only if the secrets exist)
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          if [ -z "${NOVA_KEYSTORE_BASE64}" ]; then
            echo "no signing key configured — the build stays debug-signed (updating in place needs an uninstall first)"
            exit 0
          fi
          printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 -d > android/nova-release.jks
          cat > android/keystore.properties <<EOF
          storeFile=../nova-release.jks
          storePassword=${NOVA_STORE_PASSWORD}
          keyAlias=${NOVA_KEY_ALIAS}
          keyPassword=${NOVA_KEY_PASSWORD}
          EOF
          echo "signing key restored: builds will sign with the same certificate every run"

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          if [ -f keystore.properties ]; then
            gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build-output.log
          else
            gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build-output.log
          fi

      - name: Name the artifact
        id: artifact
        run: |
          VERSION="$(cat VERSION)"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
            echo "signed release build"
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            echo "debug build (no signing key configured)"
          fi
          OUT="dist/nova-os-v${VERSION}.apk"
          mkdir -p dist
          cp "$APK" "$OUT"
          cp "$APK" dist/nova-os-latest.apk
          sha256sum "$OUT" | tee dist/SHA256SUMS.txt
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Verify the APK (what is really inside)
        id: verify
        run: |
          set +e
          node tools/inspect-apk.mjs dist/nova-os-latest.apk > dist/VERIFIED.md 2> dist/verify.errors.txt
          CODE=$?
          cat dist/verify.errors.txt >> dist/VERIFIED.md
          node tools/inspect-apk.mjs dist/nova-os-latest.apk --json >> dist/VERIFIED.md 2>/dev/null
          cat dist/VERIFIED.md
          echo "verify_exit=$CODE"
          exit $CODE

      # keep the diagnostics readable even when the gate above fails
      - name: Publish the verification report on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(cat dist/VERIFIED.md 2>/dev/null || echo 'no report')
          $(cat dist/verify.errors.txt 2>/dev/null || true)
          ── gradle build output (tail) ──
          $(grep -E 'e: |error:|FAILED|Execution failed|What went wrong|> ' build-output.log 2>/dev/null | tail -n 60 || echo 'no build log')
          ── raw tail ──
          $(tail -c 12000 build-output.log 2>/dev/null || echo 'no build log')"
          if gh release view ci-report >/dev/null 2>&1; then
            gh release edit ci-report --notes "$BODY"
          else
            gh release create ci-report --target "${GITHUB_SHA}" --prerelease \
              --title "CI verification report (diagnostics, not an install)" --notes "$BODY"
          fi

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-os-apk-v${{ steps.artifact.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Work out how to label the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.artifact.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            TITLE="NOVA OS — APK (latest)"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            TITLE="NOVA OS — APK (${GITHUB_REF_NAME}, pre-release)"
          fi
          {
            echo "## NOVA OS $VERSION"
            echo
            echo "البناء من فرع \`${GITHUB_REF_NAME}\` · commit \`${GITHUB_SHA}\`"
            echo "Built by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "قابل للتثبيت على أندرويد 8+ · Installable on Android 8+"
            echo
            echo "- **\`nova-os-latest.apk\`** — النسخة الحالية (نفس الملف اللي زر «تحميل APK» بيدوّر عليه)"
            echo "- \`nova-os-v${VERSION}.apk\` — نسخة مُرقّمة للرجوع ليها"
            echo "- \`SHA256SUMS.txt\` — للتأكد من سلامة الملف"
            echo
            echo "**التثبيت:** افتح الملف على الهاتف ← تثبيت ← اسمح بـ«تثبيت تطبيقات من مصادر غير معروفة»."
            echo "بعد كده تقدر تخليه المشغّل الافتراضي: Settings ← Apps ← Default apps ← Home app ← NOVA OS."
            echo
            if [ -f android/keystore.properties ]; then
              echo "> موقّع بمفتاحك الثابت: التحديثات بتنزل فوق النسخة القديمة من غير مسح."
            else
              echo "> النسخة دي موقّعة بمفتاح تجريبي مؤقت. لو جيت تحدّث لنسخة أحدث وظهر «تعارض في التطبيق»،"
              echo "> امسح NOVA الأول وثبّت الجديدة — أو ضيف مفاتيح التوقيع (docs/06-install.md §6) مرة واحدة"
              echo "> وبعدها كل التحديثات تنزل فوق بعضها عادي."
            fi
            echo
            echo "**التحقق من الملف · verification**"
            echo
            sed 's/^/    /' dist/VERIFIED.md
          } > dist/RELEASE_BODY.md
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
        id: rel
        shell: bash

      - name: Attach the APK to the release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ${{ steps.rel.outputs.title }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/nova-os-latest.apk
            dist/nova-os-v${{ steps.artifact.outputs.version }}.apk
            dist/SHA256SUMS.txt
            dist/VERIFIED.md
          make_latest: true
          fail_on_unmatched_files: false
