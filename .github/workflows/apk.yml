name: Build NOVA OS APK

# Produces an installable Android APK and publishes it as a GitHub Release
# asset, which is exactly what the "تحميل APK" button inside NOVA looks for
# (docs/06-install.md). No secrets required.

on:
  push:
    branches:
      - main
      - 'arena/**'      # work-in-progress builds are published as pre-releases
    paths:
      - 'prototype/**'
      - 'android/**'
      - 'tools/**'
      - 'VERSION'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the APK as a GitHub Release asset'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: nova-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build + publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install tooling
        run: npm ci

      # the motion contract is enforced before anything is shipped
      - name: Quality gates
        run: npm run check

      - name: Stage the web experience into the APK assets
        run: bash tools/stage-assets.sh

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name the artifact
        id: artifact
        run: |
          VERSION="$(cat VERSION)"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="dist/nova-os-v${VERSION}.apk"
          mkdir -p dist
          cp "$APK" "$OUT"
          cp "$APK" dist/nova-os-latest.apk
          sha256sum "$OUT" | tee dist/SHA256SUMS.txt
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Verify the APK (aapt2 + apksigner)
        id: verify
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="dist/nova-os-latest.apk"

          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt || true
          "$BT/apksigner" verify --print-certs "$APK" > /tmp/certs.txt 2>&1 || true

          {
            echo "### ما تم التحقق منه فعليًا · verified build"
            echo
            echo '```'
            grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^launchable-activity:|^application-label:" /tmp/badging.txt || true
            echo "permissions:"
            grep -E "^uses-permission:" /tmp/badging.txt || true
            echo "assets/www files: $(unzip -l "$APK" | grep -c 'assets/www')"
            echo "signature: $(grep -m1 'Signer #1 certificate DN' /tmp/certs.txt || echo 'n/a')"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "size: $(stat -c%s "$APK") bytes"
            echo '```'
          } > dist/VERIFIED.md
          cat dist/VERIFIED.md

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-os-apk-v${{ steps.artifact.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Work out how to label the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.artifact.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            TITLE="NOVA OS — APK (latest)"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            TITLE="NOVA OS — APK (${GITHUB_REF_NAME}, pre-release)"
          fi
          {
            echo "## NOVA OS $VERSION"
            echo
            echo "البناء من فرع \`${GITHUB_REF_NAME}\` · commit \`${GITHUB_SHA}\`"
            echo "Built by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "قابل للتثبيت على أندرويد 8+ · Installable on Android 8+"
            echo
            echo "- **\`nova-os-latest.apk\`** — النسخة الحالية (نفس الملف اللي زر «تحميل APK» بيدوّر عليه)"
            echo "- \`nova-os-v${VERSION}.apk\` — نسخة مُرقّمة للرجوع ليها"
            echo "- \`SHA256SUMS.txt\` — للتأكد من سلامة الملف"
            echo
            echo "**التثبيت:** افتح الملف على الهاتف ← تثبيت ← اسمح بـ«تثبيت تطبيقات من مصادر غير معروفة»."
            echo "بعد كده تقدر تخليه المشغّل الافتراضي: Settings ← Apps ← Default apps ← Home app ← NOVA OS."
            echo
            echo "**التحقق من الملف · verification**"
            echo
            sed 's/^/    /' dist/VERIFIED.md
          } > dist/RELEASE_BODY.md
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
        id: rel
        shell: bash

      - name: Attach the APK to the release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ${{ steps.rel.outputs.title }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/nova-os-latest.apk
            dist/nova-os-v${{ steps.artifact.outputs.version }}.apk
            dist/SHA256SUMS.txt
            dist/VERIFIED.md
          make_latest: true
          fail_on_unmatched_files: false
